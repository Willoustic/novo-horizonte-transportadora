name: vibra-capture

on:
  workflow_dispatch:
    inputs:
      posto:
        description: "Abreviacao do posto (ex: VIT, ZN). Deixe vazio para capturar todos."
        required: false
        default: ""

jobs:
  capturar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Install Playwright Chromium (with system deps)
        run: npx playwright install --with-deps chromium

      - name: Run vibra capture
        run: npx tsx scripts/vibra-capture.ts ${{ inputs.posto && format('--posto={0}', inputs.posto) }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          EMAIL_USER: ${{ secrets.VIBRA_EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.VIBRA_EMAIL_PASS }}
