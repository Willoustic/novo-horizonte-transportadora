name: Vibra Capture

on:
  schedule:
    # Executa diariamente às 08:00, 12:00, 14:00 e 15:00 (teste) — horários em UTC.
    # Para horário de Brasília (UTC-3), subtraia 3h: 05:00, 09:00, 11:00 e 12:00 BRT.
    - cron: "0 8 * * *"
    - cron: "0 12 * * *"
    - cron: "0 14 * * *"
    - cron: "0 15 * * *" # teste — remover após validar
  workflow_dispatch:
    inputs:
      posto:
        description: "Abreviação do posto (ex: VITORIA, PNH2-ZN, PNH1-ZS) ou ALL"
        required: false
        default: "ALL"
      data:
        description: "Data para capturar (YYYY-MM-DD), opcional"
        required: false
        default: ""

jobs:
  capturar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar dependências do Chromium (Playwright)
        run: |
          npx playwright install --with-deps chromium

      - name: Instalar dependências do projeto
        run: npm ci

      - name: Executar captura de preços Vibra
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          VIBRA_EMAIL_USER: ${{ secrets.VIBRA_EMAIL_USER }}
          VIBRA_EMAIL_PASS: ${{ secrets.VIBRA_EMAIL_PASS }}
        run: npm run vibra:capture ${{ github.event.inputs.posto && format('--posto={0}', github.event.inputs.posto) || '' }}
